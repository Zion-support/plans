name: Catalog health watchdog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/catalog_health.py"
      - "scripts/test_catalog_health.py"
      - "scripts/CATALOG_HEALTH.md"
      - ".github/workflows/catalog-health.yml"
  pull_request:
    paths:
      - "scripts/catalog_health.py"
      - "scripts/test_catalog_health.py"
      - "scripts/CATALOG_HEALTH.md"
      - ".github/workflows/catalog-health.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Test watchdog offline
        run: python3 -m unittest discover -s scripts -p 'test_catalog_health.py' -v
  check:
    needs: selftest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # This repository monitors production ziontechgroup.com, not its own build.
      # Forms and current calculator assets must be connected; HTTP 200 alone is insufficient.
      - name: Probe production routes and current offering contracts
        run: python3 scripts/catalog_health.py
